[project]
name = "open-to-work"
version = "0.1.0"
description = "Evidence-backed skill profile from GitHub history, matched against real job postings."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.1",  # Select[Model] row typing; 2.0 spells it Select[tuple[Model]]
    "pygithub>=2.3",
    "tenacity>=8.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "litellm>=1.50",
    "sentence-transformers>=3.1",
    "qdrant-client>=1.11",
    "python-multipart>=0.0.12",  # FastAPI file upload (resume) form parsing
    "cryptography>=42",  # encrypts stored API keys at rest, app/core/crypto.py
    "pypdf>=5.0",  # page-count / page-fit check on a compiled resume PDF, app/resume_build/pagefit.py
    "httpx>=0.27",  # provider key checks and raw file fetches (app/core/llm_providers.py, app/ingest/github/client.py)
    "rank-bm25>=0.2",  # keyword-only baseline retrieval, app/evals/bm25.py (pure Python)
    "pyyaml>=6.0",  # golden-set file format, app/evals/golden.py (imported directly)
    "numpy>=2.5",  # skill map vectors, app/profile/skill_map.py (imported directly)
    "scikit-learn>=1.9",  # PCA and clustering for the skill map, app/profile/skill_map.py
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",  # coverage report and minimum threshold, `make coverage`
    "ruff>=0.6",
    "mypy>=1.11",
    "requests>=2.31",  # tests/live only (imported directly)
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Form()/File()/Depends() as parameter defaults is the framework's
# actual API, not the mutable-default-argument footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Every function in app/ carries a signature. Without this, mypy silently
# skips the body of any unannotated def, so a missing return type quietly
# removed a whole function from type checking.
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
# tests/live/ is excluded: real network calls (LLM providers, GitHub, a
# running instance), opt-in only via `make test-live`.
testpaths = ["tests/unit"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
