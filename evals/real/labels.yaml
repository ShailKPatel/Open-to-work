# Labels for the real-text eval set. Sources: sources.yaml. Text: cache/
# (gitignored, rebuilt by scripts/fetch_real_eval_data.py). Criteria are
# written out in DATA_SOURCES.md; in short:
#
# repos.<repo>.skills
#   What the README demonstrates beyond the declared dependencies the
#   app already reads from manifests: languages, frameworks and practices
#   the README describes the project using or being. Not things it merely
#   links to or names as an alternative.
#
# postings.<board>-<id>.expected
#   What the posting states. `null` means the posting is ambiguous on that
#   field (two ranges, two numbers of years, a mode implied but never
#   said) and the field is not scored. `skills` is the core technology the
#   posting asks for by name, scored by recall.
#
# postings.<board>-<id>.summary
#   One line on what the role is, standing in for the role_summary the
#   app extracts from a posting and searches with (see job_posting_text).
#
# postings.<board>-<id>.relevant_skills
#   Which skills in this portfolio a reviewer would accept as evidence for
#   the posting. A judgment, not a string match: an iOS posting that only
#   says "Swift" still makes SwiftUI and UIKit evidence relevant, and a
#   posting that names no technology at all ("strong coding skills in any
#   language") still makes backend framework evidence relevant. Empty for
#   postings this portfolio has nothing to offer (sales, design).

repos:
