# Where the real-text eval set comes from. Only identifiers live here; the
# text itself is downloaded by scripts/fetch_real_eval_data.py into
# evals/real/cache/, which is gitignored. See evals/real/DATA_SOURCES.md.
#
# repos: public open-source repositories, pinned to a commit so the README
# and manifests read are always the same ones. Together they stand in for
# one developer's portfolio spanning several specialties.
#
# postings: public job postings from employers' Greenhouse job boards
# (boards-api.greenhouse.io), read through the same public API those
# boards use to render. Postings close; once one is gone it can only be
# read from a local cache, which is why the cache is kept between runs.

