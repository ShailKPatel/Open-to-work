# Hand-labeled ground truth for the skill embedding benchmark
# (scripts/benchmark_embeddings.py).
#
# categories: every skill name in the sample, mapped to the domain a
# hiring engineer would file it under. Two skills sharing a category
# should sit near each other in embedding space; that is what the
# neighbour-purity and silhouette metrics measure.
#
# trap_pairs: names that look alike but mean unrelated things. A model
# that scores these high is reading characters, not meaning. These are
# the pairs that currently put ElasticNet next to EfficientNet on the
# map.
#
# true_pairs: names that look nothing alike but belong together. A model
# that scores these low is missing domain knowledge.
#
# The headline metric is the margin between true_pairs and trap_pairs.
# Edit this file freely; the benchmark reads it, it is not generated.

