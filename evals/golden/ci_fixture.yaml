# Golden pairs for the synthetic CI fixture (scripts/seed_eval_fixture.py,
# account 9001). This is a canary, not a measurement of retrieval quality.
#
# The thirteen pairs below are labeled against invented repositories and
# invented roles, so the numbers they produce say nothing about how well
# this system retrieves anything real. What they catch is a change that
# breaks retrieval outright: an embedding model swap, a change to the text
# index.py embeds, a filter that stops matching, an id space that shifts.
# Their value is that they move when something breaks and stay still
# otherwise, which is why CI gates on them.
#
# The real golden set app/evals/golden.py's docstring targets is fifty
# hand-labeled job-to-profile pairs against a person's own data, built
# with scripts/label_golden_set.py and scored with `make eval`. That set
# measures quality. This one does not, and no size increase here would
# change that, because the underlying data is made up.
#
# Point ids above 1_000_000_000 are experience-linked skill evidence, which
# shares the skill_evidence collection at an offset (see index.py's
# _EXPERIENCE_EVIDENCE_ID_OFFSET).

