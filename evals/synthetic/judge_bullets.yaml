# Hand-labeled resume bullets for validating the groundedness judge
# (app/evals/groundedness.py). Each bullet names a synthetic persona and one
# of its repos; the judge is shown that repo's evidence exactly as the
# resume writer would be (name, description, skills, see
# format_project_evidence), never the README.
#
# `grounded` is the human label. `kind` says how an ungrounded bullet was
# made, so judge errors can be broken down by failure type:
#   faithful          restates the evidence, should pass
#   paraphrase        same facts, different words, should pass
#   wrong_tech        names a technology the evidence does not show
#   invented_metric   adds a number the evidence does not state
#   invented_feature  claims functionality the evidence does not describe
#   inflated_scope    turns a personal project into production or team scale

- {persona: backend-senior-us, repo: ledger-sync, grounded: true, kind: faithful,
   bullet: "Built a double-entry ledger service in FastAPI and PostgreSQL with idempotent posting and reconciliation."}
- {persona: backend-senior-us, repo: ledger-sync, grounded: true, kind: paraphrase,
   bullet: "Wrote a Python accounting ledger that reconciles balances and safely ignores duplicate posting requests."}
- {persona: backend-senior-us, repo: ledger-sync, grounded: false, kind: wrong_tech,
   bullet: "Built a double-entry ledger service in Spring Boot backed by Oracle."}
- {persona: backend-senior-us, repo: ledger-sync, grounded: false, kind: inflated_scope,
   bullet: "Ledger platform processing 9 billion dollars a year for 4,000 enterprise banks."}
