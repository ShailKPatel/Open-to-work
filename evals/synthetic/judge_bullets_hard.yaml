# Held-out bullets for the groundedness judge, harder than
# judge_bullets.yaml. Written after the judge scored 45/45 on that file,
# which showed its corrupted bullets were too easy to tell apart, and
# scored against the judge unchanged. Do not tune the judge's prompt
# against this file; add another held-out file instead.
#
# The judge sees only a project's name, its one-line description and its
# skill list (app/resume_build/orchestrator.py's format_project_evidence),
# never the README. Labels follow that: a bullet is grounded when every
# concrete claim is stated in that evidence or is a conservative paraphrase
# of it, and ungrounded otherwise, however plausible it sounds.
#
# Kinds:
#   grounded_inference  draws only on what the evidence shows (a skill in
#                       the list used the way the description implies)
#   generalization      says less than the evidence, in broader words
#   adjacent_tech       swaps in a neighbouring technology not in the list
#   unstated_number     adds a small, plausible figure the evidence lacks
#   role_inflation      claims leadership, a team or users for a project
#                       the evidence presents as a codebase
#   scope_shift         changes what the project does in a small way
#                       (weekly becomes real-time, demos become a library)

