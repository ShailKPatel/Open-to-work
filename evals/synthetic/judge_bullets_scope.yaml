# Second held-out set for the groundedness judge, written after the subtle
# set (judge_bullets_hard.yaml) showed the judge passing claims of team or
# organisation scope. It measures a prompt change aimed at that weakness,
# so it was written before the change and is scored against both prompts.
# Half the bullets are grounded controls, to catch a judge that starts
# flagging honest bullets. Same evidence rule as the other judge sets.
#
# Kinds:
#   scope_inflation   claims a team, a company, users, customers or
#                     production use the evidence does not mention
#   grounded_control  a faithful bullet, some phrased with ownership words
#                     ("built", "designed", "maintained") that are true of
#                     anyone's own repository

- {persona: backend-senior-us, repo: ratelimit-go, grounded: false, kind: scope_inflation,
   bullet: "Built the token bucket rate limiter that protects the company's public APIs, in Go with Redis."}
