repos:
  - key: sparse-retriever
    name: sparse-retriever
    language: Python
    stars: 512
    description: Learned sparse retrieval with a BERT encoder, code for a published paper.
    readme: |
      # sparse-retriever
      Training and evaluation code for a learned sparse retrieval model. A
      BERT encoder predicts term weights, documents are indexed in an inverted
      index, and evaluation reports MRR@10 and nDCG@10 on MS MARCO and BEIR.
      Training runs on PyTorch with mixed precision across 8 GPUs.
    manifests:
      requirements.txt: [torch, transformers, numpy, faiss-cpu, pytest]
    readme_skills: [Information Retrieval, Natural Language Processing, Python]
  - key: rag-eval-kit
    name: rag-eval-kit
    language: Python
    stars: 133
    description: Small library for evaluating retrieval augmented generation pipelines.
    readme: |
      # rag-eval-kit
      Scores RAG pipelines on retrieval recall, answer faithfulness and
      citation accuracy. Uses an LLM judge calibrated against human labels and
      reports bootstrap confidence intervals. Vector search through Qdrant.
    manifests:
      pyproject.toml: [qdrant-client, sentence-transformers, openai, pandas]
    readme_skills: [Retrieval-Augmented Generation, LLM Evaluation]
