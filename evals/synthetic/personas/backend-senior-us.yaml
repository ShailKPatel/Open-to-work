repos:
  - key: ledger-sync
    name: ledger-sync
    language: Python
    stars: 214
    description: Double-entry ledger service with idempotent posting and reconciliation.
    readme: |
      # ledger-sync
      A double-entry ledger service written with FastAPI and PostgreSQL. Every
      posting is idempotent by request key, and a nightly Celery job reconciles
      balances against the bank feed. Ships as a Docker image with a
      docker-compose file for local development.
    manifests:
      requirements.txt: [fastapi, sqlalchemy, psycopg2-binary, celery, redis, pydantic, pytest]
    readme_skills: [Python, Docker]
  - key: ratelimit-go
    name: ratelimit-go
    language: Go
    stars: 88
    description: Token bucket rate limiter backed by Redis with a gRPC API.
    readme: |
      # ratelimit-go
      A distributed token bucket rate limiter. Buckets live in Redis and are
      updated with a Lua script so a check is a single round trip. Exposes a
      gRPC service and a Gin HTTP adapter. Load tested to 40k checks per second.
    manifests:
      go.mod: [github.com/gin-gonic/gin, google.golang.org/grpc, github.com/redis/go-redis/v9]
    readme_skills: [Go, Redis, Lua]
  - key: pg-audit-trail
    name: pg-audit-trail
    language: SQL
    stars: 31
    description: Trigger-based audit history for PostgreSQL tables.
    readme: |
      # pg-audit-trail
      Installs PL/pgSQL triggers that write every row change to an audit
      schema, partitioned by month. Includes a migration helper and a query
      cookbook for answering "who changed this and when".
    manifests: {}
    readme_skills: [PostgreSQL, SQL, PL/pgSQL]
  - key: dotfiles
    name: dotfiles
    language: Shell
    stars: 4
    description: Personal shell and editor configuration.
    readme: |
      # dotfiles
      Zsh, tmux and Neovim configuration. Install with the bootstrap script.
    manifests: {}
    readme_skills: [Bash]

