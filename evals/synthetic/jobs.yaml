# Invented job postings for the synthetic eval set (app/evals/synthetic.py).
# Every company, person and number here is made up.
#
# Each posting serves two evals:
#   - extraction: `expected` is what app/profile/job_extract.py should read
#     out of `text`. `skills` is the set of skills the posting asks for,
#     compared case-insensitively; other fields are compared after trimming.
#   - retrieval: for every persona in `for`, the posting becomes a golden
#     query, and its relevant ids are the persona's evidence carrying one of
#     `skills` (see golden_pairs()). Postings with an empty `for` are
#     extraction-only, including the off-domain ones a matcher should rank
#     nobody for.
#
# `covers` names what the posting is there to exercise, so a gap in the
# spread is visible at a glance.

