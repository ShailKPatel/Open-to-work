name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, opens a pull request or publishes
# anything, so the token gets read access and no more: a compromised action
# in the tree below cannot push with it.
permissions:
  contents: read

# A second push to a branch makes the first run's answer stale before it
# finishes. Cancel it rather than pay for both and wait behind the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The unit suite needs no Qdrant server: app/retrieval/vectorstore.py hands
  # back an in-process client for ":memory:". Set explicitly rather than left
  # to the application default, so the workflow states what the tests run
  # against instead of inheriting it silently.
  QDRANT_URL: ":memory:"
  # No test loads a real embedding model; the ones that would are faked. These
  # two turn a future accidental download (400MB, once per run, uncached) into
  # an immediate failure instead of a slow green run that nobody questions.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 is what the Dockerfile ships. CI checks the version that runs
          # in production, not whatever the runner defaults to this month.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          # CPU-only torch first, for the reason the Dockerfile spells out:
          # PyPI's default torch wheel pulls the entire CUDA stack (cudnn,
          # cublas, nccl, triton) in behind sentence-transformers, several GB
          # that nothing in this project uses. Installing the CPU build first
          # satisfies the dependency before pip can reach for the GPU one.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        # Runs even when ruff failed, so one run reports every problem in the
        # tree instead of one tool's worth. continue-on-error would surface
        # the same output but leave the job green, which defeats the gate.
        if: ${{ !cancelled() }}
        run: mypy app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          # Same CPU-only torch reasoning as the lint job above.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: pytest
        shell: bash
        run: |
          # testpaths in pyproject.toml already limits this to tests/unit, so
          # tests/live (real network, real billed LLM calls) cannot be reached
          # from here even by accident. The 90% branch-coverage threshold also
          # lives in pyproject.toml: one number, enforced identically by
          # `make coverage` on a laptop and by this step.
          # pipefail keeps pytest's exit status rather than tee's.
          set -o pipefail
          pytest --cov --cov-report=term --cov-report=xml | tee coverage.txt

      - name: Coverage summary
        # Runs on failure too: a run that fell below the threshold is exactly
        # when the number is worth reading off the run page.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Coverage"
            echo '```'
            grep -E '^(TOTAL|Required test coverage|Coverage failure)' coverage.txt || \
              echo "no coverage summary produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
