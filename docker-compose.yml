services:
  app:
    build: .
    # Host port defaults to 8000. `make start` picks the next free port when
    # it is busy and passes it in as APP_PORT.
    # Bound to 127.0.0.1: this app is meant for the machine it runs on.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
      - tectonic_cache:/root/.cache/tectonic
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # No published port: only the app reaches Qdrant, over the compose
  # network. Qdrant has no login and no Host check, so a port on the host
  # would let any local process or a DNS-rebinding web page read or wipe
  # it. docker-compose.dev.yml publishes it for host-side development.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
  hf_cache:
  tectonic_cache:
