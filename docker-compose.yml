services:
  app:
    build: .
    # Host ports default to 8000 and 6333. `make start` picks the next free
    # port when one is busy and passes it in as APP_PORT / QDRANT_PORT.
    # Bound to 127.0.0.1: this app is meant for the machine it runs on.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
      - tectonic_cache:/root/.cache/tectonic
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
  hf_cache:
  tectonic_cache:
